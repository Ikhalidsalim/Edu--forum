<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>
    <link rel="stylesheet" href="reg instructor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Create an account</h1>
        <p>Sign Up to get started</p>

        

        <form class="student-form">

           
            <fieldset class="name-field">
                <legend>Full Name</legend>
                <input type="text" placeholder="Enter your full name" name="username" required>
            </fieldset>

            <fieldset class="email-field">
                <legend>Email</legend>
                <input type="email" placeholder="Enter your email" id="email" name="email" required>
            </fieldset>

            

            <fieldset class="pword-field">
                <legend>Password</legend>
                <input type="password" placeholder="Create Password" id="p-word" name="p-word" required>
            </fieldset>

            <fieldset class="pword-field">
                <legend>Confirm Password</legend>
                <input type="password" placeholder="Confirm Password" id="confirm-p-word" name="confirm-p-word"
                    required>
            </fieldset>

            <footer>
                <button type="submit">Sign Up</button>

                <p>Already have an account? <a href="landing.html" target="_self">Sign In</a></p>
            </footer>
        </form>

        
    </div>
</body>

</html>
