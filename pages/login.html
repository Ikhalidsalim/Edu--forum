<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/CSS1/styles.css">
    <link rel="stylesheet" href="/CSS1/login.css">
    <link rel="index.html" href="index.html">
</head>
<body>
 <main>
    <div class="login-container">
        <div class="welcoming-text">
            <h1>Welcome back! <i class="bi bi-hand-thumbs-up"></i> </h1>
            <p>sign in to continue to your account</p>
        </div>
      

        <form id="loginForm">
            <label class="mail">Email</label><br>
            <input class="email" type="email" placeholder="Enter your email">
            <div class="password-fill">
                 <label class="pass" >password</label><br>
                <input class="password" type="password" placeholder="Enter your password">
                <span class="eye-icon"><i class="bi bi-eye-slash"></i></span>
            </div>
            <div class="options">
                <label> <input type= "checkbox"> Remember me </label>
                <a href="forgot password?"></a>
            </div>
            <button class="sign-in">sign in</button>
            <p> Dont have an account? <a href="register.html">sign up</a></p>
        </form>
    </div>
 </main>

 <script>

    const loginForm = document.getElementById('loginForm');
      loginForm.addEventListener('submit', function(event) {
      event.preventDefault(); // Prevent form submission
      window.location.href = "dashboard.html"; // Redirect to dashboard page
      });
 </script>
</body>
</html>
