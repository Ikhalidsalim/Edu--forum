<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — EduForum</title>
    <meta name="description" content="Sign in to your EduForum account to access courses, assignments, and discussions.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/CSS1/styles.css">
    <link rel="stylesheet" href="/CSS1/auth.css">
</head>
<body>

    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="card-brand">
                <div class="brand-icon">
                    <i class="bi bi-mortarboard-fill"></i>
                </div>
                <span>EduForum</span>
            </a>

            <div class="auth-header">
                <h1>Welcome back</h1>
                <p>Sign in to continue to your account</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye-slash" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label" for="remember">
                        <input type="checkbox" id="remember" name="remember">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Sign in</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="auth-divider">
                <span>or continue with</span>
            </div>

            <div class="social-buttons">
                <button type="button" class="btn-social">
                    <i class="bi bi-google"></i>
                    Google
                </button>
                <button type="button" class="btn-social">
                    <i class="bi bi-github"></i>
                    GitHub
                </button>
            </div>

            <p class="auth-footer-text">
                Don't have an account? <a href="register.html">Sign up free</a>
            </p>
        </div>
    </main>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'bi bi-eye' : 'bi bi-eye-slash';
        });

        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', function(event) {
            event.preventDefault();
            submitBtn.classList.add('btn-loading');
            submitBtn.disabled = true;
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.auth-card').classList.add('animate-in');
        });
    </script>
</body>
</html>
