<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — EduForum</title>
    <meta name="description" content="Create your free EduForum account and start learning, collaborating, and succeeding together.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS1/styles.css">
    <link rel="stylesheet" href="../CSS1/auth.css">
</head>
<body>

    <div class="bg-decor">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="auth-page">
        <div class="auth-card">
            <a href="index.html" class="card-brand">
                <div class="brand-icon">
                    <img src="/assests/cognicCamp_logo.svg" width="70px">
                </div>
                <span>CogniCamp</span>
            </a>

            <div class="auth-header">
                <h1>Create your account</h1>
                <p>Sign up to get started — it's free</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="fullname">Full name</label>
                    <div class="input-wrapper">
                        <i class="bi bi-person input-icon"></i>
                        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required autocomplete="name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Create password" required autocomplete="new-password" minlength="8">
                            <button type="button" class="toggle-password" id="togglePassword1" aria-label="Toggle password visibility">
                                <i class="bi bi-eye-slash" id="eyeIcon1"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock input-icon"></i>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required autocomplete="new-password">
                            <button type="button" class="toggle-password" id="togglePassword2" aria-label="Toggle password visibility">
                                <i class="bi bi-eye-slash" id="eyeIcon2"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Password strength indicator -->
                <div class="password-strength" id="passwordStrength">
                    <div class="strength-bars">
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                        <div class="strength-bar"></div>
                    </div>
                    <span class="strength-text" id="strengthText"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label" for="terms">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <span class="btn-text">Create account</span>
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>

            <div class="auth-divider">
                <span>or sign up with</span>
            </div>

            <div class="social-buttons">
                <button type="button" class="btn-social">
                    <i class="bi bi-google"></i>
                    Google
                </button>
                <button type="button" class="btn-social">
                    <i class="bi bi-github"></i>
                    GitHub
                </button>
            </div>

            <p class="auth-footer-text">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </div>
    </main>

    <script>
        // Toggle password visibility
        function setupToggle(btnId, inputId, iconId) {
            const btn = document.getElementById(btnId);
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            btn.addEventListener('click', () => {
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'bi bi-eye' : 'bi bi-eye-slash';
            });
        }
        setupToggle('togglePassword1', 'password', 'eyeIcon1');
        setupToggle('togglePassword2', 'confirmPassword', 'eyeIcon2');

        // Password strength meter
        const passwordInput = document.getElementById('password');
        const strengthBars = document.querySelectorAll('.strength-bar');
        const strengthText = document.getElementById('strengthText');
        const strengthContainer = document.getElementById('passwordStrength');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let score = 0;

            if (val.length >= 8) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
            const colors = ['', '#EF4444', '#F59E0B', '#3B82F6', '#22C55E'];

            strengthContainer.style.display = val.length > 0 ? 'flex' : 'none';

            strengthBars.forEach((bar, i) => {
                if (i < score) {
                    bar.style.background = colors[score];
                } else {
                    bar.style.background = '#E5E7EB';
                }
            });
            strengthText.textContent = labels[score];
            strengthText.style.color = colors[score];
        });

        // Form submission
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        registerForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (pwd !== confirm) {
                document.getElementById('confirmPassword').setCustomValidity('Passwords do not match');
                document.getElementById('confirmPassword').reportValidity();
                return;
            }

            submitBtn.classList.add('btn-loading');
            submitBtn.disabled = true;
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 800);
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            this.setCustomValidity('');
        });

        // Animate card on load
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.auth-card').classList.add('animate-in');
        });
    </script>
</body></html>
