<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>explore</title>
    <link rel="stylesheet" href="../CSS1/explore.css">
    <link rel="stylesheet" href="../CSS1/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>
    <div class="explore-grid">
        <div class="formhead" data-label="form-head">
            <span class="search-icon"><i class="bi bi-search"></i></span>
            <input type="text" placeholder="Search channels...">
        </div>


        <div class="formbody" data-label="form-body">

            <h2>CREATE A ROOM</h2>

            <div class="field">
                <label>Room Name</label>
                <input type="text" placeholder="Enter room name...">
            </div>

            <div class="field">
                <label>Category</label>
                <select>
                    <option>Category</option>
                </select>
                <ul class="category-list">
                    <li>Gaming</li>
                    <li>Art</li>
                    <li>Science</li>
                    <li>Education</li>
                    <li>More</li>
                    <li>Custom</li>
                </ul>
            </div>

            <div class="field">
                <label>Privacy</label><br>
                <div class="privacy-toggle">
                    <span class="active">Public</span>
                    <span>Private</span>
                </div>
            </div>

            <div class="field">
                <label>Cover Image</label>
                <div class="upload-box">
                    <div class="upload-icon-box"><i class="bi bi-image"></i></div>
                    <button class="btn-outline">Upload Cover</button>
                </div>
            </div>

            <div class="field">
                <label>Room Icon</label>
                <div class="upload-box">
                    <div class="upload-icon-box"><i class="bi bi-upload"></i></div>
                    <button class="btn-outline">Upload Icon</button>
                </div>
            </div>

            <div class="field">
                <label>Description</label>
                <textarea placeholder="Room description..."></textarea>
            </div>

            <div class="submit-block">
                <button class="btn-primary">Create Room</button>
            </div>
        </div>


        <div class="mainhead" data-label="main-head">

            <h1>Discover Rooms</h1>

        </div>



        <div class="maingrid">
            <div class="card">
                <div class="room-card">
                    <div class="room-cover" style="background-image:linear-gradient(135deg,#f7971e,#ffd200), url('https://images.unsplash.com/photo-1516321165247-4aa89a48be28?auto=format&fit=crop&w=1200&q=80'); background-size: cover; background-position: center;">
                        <img src="https://images.unsplash.com/photo-1516321165247-4aa89a48be28?auto=format&fit=crop&w=1200&q=80" alt="Room Cover">
                    </div>
                    <div class="room-info">
                        <h3>Art &amp; Design</h3>
                        <p>The new cards ran with diverse art forms, and diverse art forms.</p>
                        <div class="room-stats">
                            <div><span class="dot"></span>587,179 Online</div>
                            <div><span class="dot grey"></span>1,620,980 Members</div>
                        </div>
                        <button class="join-btn">Join</button>
                    </div>
                </div>
            </div>

            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
            <div class="card"></div>
        </div>
    </div>
</body>

</html>
