<div class="group-chat">
  <style>
    .group-chat {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
    }
    .group-chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border, #e5e5e5);
      background: var(--surface, #fff);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading, sans-serif);
    }
    .group-chat-header i {
      color: var(--muted, #888);
    }
    .group-chat-header h2 {
      margin: 0;
      font-size: 1.1rem;
    }
    .group-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--page-bg, #f7f8fa);
    }
    .gc-message {
      display: flex;
      gap: 10px;
      max-width: 640px;
    }
    .gc-message img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .gc-message-body {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #e5e5e5);
      border-radius: 10px;
      padding: 8px 12px;
    }
    .gc-message-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .gc-message-top strong {
      font-size: 0.9rem;
    }
    .gc-message-top span {
      font-size: 0.7rem;
      color: var(--muted, #888);
    }
    .gc-message-body p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--paragraph, #333);
    }
    .group-chat-input {
      padding: 14px 20px;
      border-top: 1px solid var(--border, #e5e5e5);
      background: var(--surface, #fff);
      display: flex;
      gap: 10px;
    }
    .group-chat-input input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid var(--border, #e5e5e5);
      font-size: 0.9rem;
    }
    .group-chat-input button {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      background: var(--button, #0a66c2);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>

  <div class="group-chat-header">
    <i class="bi bi-hash"></i>
    <h2>general</h2>
  </div>

  <div class="group-chat-messages">
    <div class="gc-message">
      <img src="../assests/pfp pic.jpg" alt="Katie W">
      <div class="gc-message-body">
        <div class="gc-message-top">
          <strong>Katie W</strong>
          <span>9:14 AM</span>
        </div>
        <p>Morning team, quick reminder standup is at 10.</p>
      </div>
    </div>
    <div class="gc-message">
      <img src="../assests/pfp pic.jpg" alt="Arnold J">
      <div class="gc-message-body">
        <div class="gc-message-top">
          <strong>Arnold J</strong>
          <span>9:20 AM</span>
        </div>
        <p>Sounds good, I'll bring the updated layout files.</p>
      </div>
    </div>
  </div>

  <div class="group-chat-input">
    <input type="text" placeholder="Message #general" disabled>
    <button type="button" disabled>Send</button>
  </div>
</div>
