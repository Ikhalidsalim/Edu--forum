<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eduForm</title>
    <link rel="stylesheet" href="/CSS1/dashboard.css">
    <link rel="stylesheet" href="/CSS1/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>

<body>
    <div class="grid-template">
        <div class="top-bar">
            <div class="top-flex">
                <!--logo grid-->
                <div class="top-flex-1">
                    <div class="top-flexbox-1" style="grid-area: top-flexbox-1">
                        <img src="" alt="logo">
                    </div>


                </div>
                <!--search bar-->
                <div class="top flex-2" class="top-flex2">
                    <input type="search" placeholder="Assignments, Announcement, Materials">
                    <button class="search-icon"><i class="bi bi-search"></i></button>


                </div>
                

                <!--account details-->

                <div class="top flex-3" class="top-flex4">
                    <div>
                        <a href="pages\activity.html" target="">
                        <i class="bi bi-bell"></i>
                        </a>
                    </div>
                    <img src="/assests/pfp pic.jpg" class="profile-pic" alt="pfp">
                    <button>
                        <strong>Dr. Evelyn Carter</strong>
                    </button>
                </div>

            </div>
        </div>
        <div class="side-bar">
            <div class="side-item">
                <a href="activity.html" target="display-tab">
                    <i class="bi bi-bell"></i>
                    <span>Activity</span>
                </a>
            </div>
            <div class="side-item">
                <a href="chat.html" target="display-tab">
                    <i class="bi bi-chat-left"></i>
                    <span>Chat</span>
                </a>
            </div>
            <div class="side-item">
                <a href="room.html" target="display-tab">
                    <i class="bi bi-people"></i>
                    <span>Rooms</span>
                </a>
            </div>
            <div class="side-item">
                <a href="assignment.html" target="display-tab">
                    <i class="bi bi-book"></i>
                    <span>Assignments</span>
                </a>
            </div>
            <div class="side-item">
                <a href="analytics.html" target="display-tab">
                    <i class="bi bi-graph-up"></i>
                    <span>Analytics</span>
                </a>
            </div>
            <div class="side-item">
                <a href="profile.html" target="display-tab">
                    <i class="bi bi-person-circle"></i>
                    <span>Profile</span>
                </a>
            </div>
            <div class="side-item">
                <a href="settings.html" target="display-tab">
                    <i class="bi bi-gear"></i>
                </a>
            </div>
            </ul>
        </div>
        <div class="main-content">
            <iframe class="display-tab" border="0" name="display-tab">

            </iframe>
        </div>
    </div>
</body>

</html>
