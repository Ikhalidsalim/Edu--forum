<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms</title>
  <link rel="stylesheet" href="/CSS1/room.css">
  <link rel="stylesheet" href="/CSS1/styles.css">
  <link rel="stylesheet" href="/CSS1/chat.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

  <div class="container" style="grid-area: container">

    <!-- Sidebar -->
    <aside class="sidebar" style="grid-area: sidebar">
      <div class="workspace-header">
        <fieldset class="workspace-name">
          <select class="workspace-select" id="workspaceSelect" aria-label="Select workspace">
            <option value="workspace1">Workspace 1</option>
            <option value="workspace2">Workspace 2</option>
          </select>
        </fieldset>
        <button class="workspace-menu-btn" aria-label="Workspace menu">NEW
          <i class="bi bi-three-dots-vertical" color="white"></i>
        </button>
      </div>

      <!-- CHANNELS: content swapped per workspace via JS -->
      <div class="channel room-list">
        <button class="room-label" aria-expanded="true">Channels</button>
        <nav class="sidebar-nav" id="channelsNav"></nav>
      </div>

      <!-- PINNED: content swapped per workspace via JS -->
      <div class="channel room-list pinned-section">
        <button class="room-label" aria-expanded="true">Pinned</button>
        <nav class="sidebar-nav" id="pinnedNav"></nav>
      </div>

    </aside>

    <!-- Main Content stays the same -->
    <main class="main" style="grid-area: main">
      <div id="main-content">

      </div>
    </main>

  </div>

  <!-- Your existing scripts -->
  <script>
    // ---- Workspace data: only channels + pinned differ per workspace ----
    const workspaceData = {
      workspace1: {
        channels: ["general", "design-team", "marketing", "random"],
        pinned: [
          { title: "Announcements", sub: "Pinned by workspace admin", fragment: "/pages/room-announcement.html" },
          { title: "Uploads", sub: "Pinned files & materials", fragment: "/pages/room-materials.html" }
        ]
      },
      workspace2: {
        channels: ["dev-team", "qa", "support"],
        pinned: [
          { title: "Announcements", sub: "Pinned by workspace admin", fragment: "/pages/room-announcement.html" },
          { title: "Uploads", sub: "Pinned files & materials", fragment: "/pages/room-materials.html" }
        ]
      }
    };

    function renderChannels(workspaceKey) {
      const nav = document.getElementById('channelsNav');
      const data = workspaceData[workspaceKey].channels;
      nav.innerHTML = data.map((name, i) => `
        <a href="#" data-fragment="/pages/group-chat.html" data-channel="${name}" class="${i === 0 ? 'active' : ''}">
          <i class="bi bi-hash"></i> ${name}
        </a>
      `).join('') + `
        <button class="add-channel-btn" type="button">
          <i class="bi bi-plus-circle"></i> Add channel
        </button>
      `;
    }

    function renderPinned(workspaceKey) {
      const nav = document.getElementById('pinnedNav');
      const data = workspaceData[workspaceKey].pinned;
      nav.innerHTML = data.map(item => `
        <a href="#" data-fragment="${item.fragment}" class="pinned-item">
          <i class="bi bi-pin-angle-fill"></i>
          <span class="pinned-text">
            <span class="pinned-title">${item.title}</span>
            <span class="pinned-sub">${item.sub}</span>
          </span>
        </a>
      `).join('');
    }

    function renderWorkspace(workspaceKey) {
      renderChannels(workspaceKey);
      renderPinned(workspaceKey);
      attachNavListeners();
    }

    function attachNavListeners() {
      document.querySelectorAll('.channel .sidebar-nav a').forEach((link) => {
        link.addEventListener('click', () => {
          document.querySelectorAll('.channel .sidebar-nav a').forEach((a) => a.classList.remove('active'));
          link.classList.add('active');
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const select = document.getElementById('workspaceSelect');

      // initial render
      renderWorkspace(select.value);

      // re-render on workspace switch
      select.addEventListener('change', (e) => {
        renderWorkspace(e.target.value);
      });

      // collapsible sections (unchanged behavior)
      const roomLists = document.querySelectorAll('.room-list');
      roomLists.forEach((roomList) => {
        const trigger = roomList.querySelector('.room-label');
        const nav = roomList.querySelector('.sidebar-nav');
        if (!trigger || !nav) return;

        const setOpen = (isOpen) => {
          roomList.classList.toggle('open', isOpen);
          trigger.setAttribute('aria-expanded', String(isOpen));
        };
        setOpen(true);

        trigger.addEventListener('click', () => {
          const isAlreadyOpen = roomList.classList.contains('open');
          setOpen(!isAlreadyOpen);
        });
      });
    });
  </script>
  <script src="/JS1/app.js"></script>
</body>

</html>
