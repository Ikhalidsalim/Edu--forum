<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooms</title>
  <link rel="stylesheet" href="/CSS1/room.css">
  <link rel="stylesheet" href="/CSS1/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

  <div class="container" style="grid-area: container">

    <!-- Sidebar changed to Slack-style -->
    <aside class="sidebar" style="grid-area: sidebar">

      <!-- Workspace Header -->
      <div class="workspace-header">
        <h2>New Workspace</h2>
        <button class="upgrade-btn">Get 50% off Pro</button>
      </div>

      <!-- Directories -->
      <div class="sidebar-section">
        <h3 class="section-title">Directories</h3>
      </div>

      <!-- Starred -->
      <div class="sidebar-section">
        <h3 class="section-title">Starred</h3>
      </div>

      <!-- Channels -->
      <div class="sidebar-section">
        <h3 class="section-title">Channels</h3>
        <ul class="channel-list">
          <li><a href="#" class="channel-link">#general</a></li>
          <li><a href="#" class="channel-link">#random</a></li>
          <li><button class="add-channel-btn">+ Add channels</button></li>
        </ul>
      </div>

      <!-- Direct Messages -->
      <div class="sidebar-section">
        <h3 class="section-title">Direct messages</h3>
        <ul class="dm-list">
          <li><a href="#" class="dm-link">zainabshehu2005</a></li>
          <li><button class="invite-btn">+ Invite people</button></li>
        </ul>
      </div>

      <!-- Room sections (Announcements, Materials) -->
      <div class="room-list">
        <button class="room-label" aria-expanded="false">Room Sections</button>
        <nav class="sidebar-nav">
          <a href="#" data-fragment="/pages/room-announcement.html" class="active">Announcements</a>
          <a href="#" data-fragment="/pages/room-materials.html">Materials</a>
        </nav>
      </div>

    </aside>

    <!-- Main Content stays the same -->
    <main class="main" style="grid-area: main">
      <div id="main-content">

      </div>
    </main>

  </div>

  <!-- Your existing scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const roomLists = document.querySelectorAll('.room-list');

      roomLists.forEach((roomList) => {
        const trigger = roomList.querySelector('.room-label');
        const nav = roomList.querySelector('.sidebar-nav');

        if (!trigger || !nav) return;

        const setOpen = (isOpen) => {
          roomList.classList.toggle('open', isOpen);
          trigger.setAttribute('aria-expanded', String(isOpen));
        };

        trigger.addEventListener('click', () => {
          const isAlreadyOpen = roomList.classList.contains('open');

          roomLists.forEach((other) => {
            const otherTrigger = other.querySelector('.room-label');
            if (otherTrigger) otherTrigger.setAttribute('aria-expanded', 'false');
            other.classList.remove('open');
          });

          setOpen(!isAlreadyOpen);
        });
      });
    });
  </script>
  <script src="/JS1/app.js"></script>
</body>

</html>
